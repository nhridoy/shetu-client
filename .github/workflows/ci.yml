name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run biome lint .
      - run: bun run tsc
      - run: bun run vitest run
      - run: node --test scripts/build-update-manifest.test.mjs
      - run: node --test scripts/install.test.mjs scripts/install-windows.test.mjs
