name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build every platform as a dry run; only tag pushes publish.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    environment: Release
    steps:
      - uses: actions/checkout@v4
      - name: Check release credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is required'; exit 1; }
          test -n "$MACOS_SIGNING_CERTIFICATE" || { echo 'MACOS_SIGNING_CERTIFICATE is required'; exit 1; }
          test -n "$MACOS_SIGNING_CERTIFICATE_PASSWORD" || { echo 'MACOS_SIGNING_CERTIFICATE_PASSWORD is required'; exit 1; }
          test -n "$VITE_API_URL" || { echo 'Variable VITE_API_URL is required'; exit 1; }
      - name: Check tag and app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || { echo 'Tag and Tauri version differ'; exit 1; }
      - name: Test update manifest builder
        run: node scripts/build-update-manifest.test.mjs

  desktop:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          # Cross-compiled on x64 with the runner's MSVC ARM64 tools.
          - platform: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - platform: darwin-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: darwin-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    environment: Release
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # ring needs clang to build for Windows ARM64.
      - name: Put clang on PATH for Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 libssl-dev
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      # One certificate for every release keeps Shetu's code identity stable, so the macOS
      # keychain keeps trusting it after an update. Ad-hoc signatures change with each build.
      # Imported by hand: Tauri's APPLE_CERTIFICATE import only accepts Apple-trusted certificates.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/shetu-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KEYCHAIN"
          echo "APPLE_SIGNING_IDENTITY=Shetu Self-Signed" >> "$GITHUB_ENV"
      - name: Build signed desktop bundles
        env:
          # Tauri skips the Finder AppleScript that applies the DMG background and layout when CI=true.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
      - name: Check macOS signature
        if: runner.os == 'macOS'
        env:
          # SHA-1 of the "Shetu Self-Signed" certificate (public). Every release must match it, or
          # macOS sees a new app and asks for keychain access again. Change only on purpose.
          EXPECTED_CERTIFICATE: 053a25a0eaace880ed666f82888d5127d1f4cd7a
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Shetu.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          REQUIREMENT="$(codesign -d -r- "$APP" 2>&1)"
          echo "$REQUIREMENT"
          grep -q "identifier \"com.nhridoy.shetu\" and certificate root = H\"$EXPECTED_CERTIFICATE\"" <<< "$REQUIREMENT" \
            || { echo "Shetu.app is not signed with certificate $EXPECTED_CERTIFICATE"; exit 1; }
      # The bundler only signs the AppImage; .deb installs need their own signature to update in-app.
      - name: Sign .deb for in-app updates
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for deb in src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb; do
            [ -f "$deb.sig" ] || bun tauri signer sign -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$deb"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error

  publish:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-*'
          path: release-assets
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f "tag_name=${GITHUB_REF_NAME}" --jq '.body' > release-notes.md
      - name: Build update manifest
        run: |
          node scripts/build-update-manifest.mjs --version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME" --assets release-assets --output publish-assets --notes-file release-notes.md --pubkey-config src-tauri/tauri.conf.json
          # After the manifest so the in-app update dialog doesn't show first-install help.
          # Prereleases skip it: the one-line installers fetch releases/latest, which excludes them.
          [[ "$GITHUB_REF_NAME" == *-* ]] || cat .github/install-note.md >> release-notes.md
      - name: Create draft release with validated artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: publish-assets/*
          fail_on_unmatched_files: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
