name: Bug report
description: Something isn't working, or Shetu crashed.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shetu version
      description: Settings → Advanced, or the release you installed.
      placeholder: 0.0.11
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1 (Apple Silicon) / Windows 11 x64 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Drag the log file here. Shetu never logs passwords, keys or terminal output, and removes IP addresses and hostnames from error messages.

        **If Shetu opens:** Settings → Advanced → **Export logs**.

        **If Shetu crashes before it opens,** attach the newest `shetu*.log` from:
        - macOS: `~/Library/Logs/com.nhridoy.shetu/`
        - Windows: `%LOCALAPPDATA%\com.nhridoy.shetu\logs\`
        - Linux: `~/.local/share/com.nhridoy.shetu/logs/` (or `$XDG_DATA_HOME/com.nhridoy.shetu/logs/` if you set `XDG_DATA_HOME`)
